name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        run: |
          echo "${{ secrets.XHSPHONE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/xhsphone.keystore

      - name: Build signed APK
        run: |
          cd app
          ../gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/xhsphone.keystore \
            -Pandroid.injected.signing.store.password='${{ secrets.XHSPHONE_STORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.XHSPHONE_KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.XHSPHONE_KEY_PASSWORD }}'
        env:
          VERSION_NAME: ${{ inputs.version_name }}

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             xhs-phone_${{ inputs.version_name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: v${{ inputs.version_name }}
          files: xhs-phone_${{ inputs.version_name }}.apk
